# Which NPC provider to use: builtin (villager entities) or citizens (Citizens2 plugin)
npc-provider: builtin

# AI backend to use: ollama or openai
backend: ollama

ollama:
  url: http://localhost:11434
  model: llama3
  # Maximum seconds to wait for a response before giving up
  timeout-seconds: 60

openai:
  # Base URL — change this for local OpenAI-compatible servers (LM Studio, Groq, vLLM, etc.)
  # Currently pointed at Groq's free OpenAI-compatible endpoint
  url: https://api.groq.com/openai/v1
  # API key — get one free at https://console.groq.com/keys, no credit card required
  api-key: ""
  model: llama-3.3-70b-versatile

# Stream tokens to the action bar as they arrive, then print the full reply in chat
streaming: false

moderation:
  enabled: false
  # Messages containing any of these phrases (case-insensitive) are blocked
  blocked-phrases: []
  # What the NPC says when a message is blocked
  blocked-response: "I cannot discuss that topic."
  # Optional Discord webhook URL — fires an alert embed when a message is blocked
  discord-webhook: ""

memory:
  # Generate a short memory summary after each conversation and inject it on the next visit
  enabled: true
  # Memories older than this many days are ignored
  max-age-days: 30

conversation:
  # Maximum player messages per conversation (safety cap; tasks can also set their own limit)
  max-exchanges: 10
  # Seconds a player must wait between messages to the same NPC
  cooldown-seconds: 3
  # Seconds of silence before the conversation times out and ends automatically
  listen-timeout-seconds: 60
